<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期末 Pass 算命機 (PassMaster) 🎯</title>
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=KWY2JT2lYKN2vfVP0Ec2_0RDNIx8t9E1eSGbiSU5dHyfpZTm5hg4FXl_0LKrT9ot6f3r-Mj-SFVoWh0BxMDuWQG4Z3Rene7AFcsYiWsGjgYYwFP6IOE7XDfdzV7pz5Cof32ug5rRy-qM5Bnrq0pSNdtEOJfnuVN6wDBvJtG1zcIEF6AkI5S1aNWysdUm3MRZAFR2WL8-xdZShBAa3UmFWp9eJLZeiHCUv42b3fMnccfp8RxfePYmEJryqFv9W9lnEOnO-PXyXhKbXZhUiLfwQG7vjacwHyLTIWsP_Ofu-WyVs7oiWI0PDrE0BEBlIbHQ" charset="UTF-8"></script><style>
    :root {
      --bg-primary: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #475569;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      
      --state-safe: #34d399;
      --state-info: #38bdf8;
      --state-warn: #fbbf24;
      --state-danger: #fb923c;
      --state-critical: #f87171;
      
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 30px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1040px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 1.05rem;
    }

    /* 模式切換按鈕 */
    .tab-nav {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1.5px solid var(--card-border);
      background: #1e293b;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: #f1f5f9;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    /* 頂部 Dashboard */
    .summary-bar {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 24px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
      border: 1px solid var(--card-border);
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-item .label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .summary-item .val {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .grid-main {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    @media (max-width: 820px) {
      .grid-main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      background: var(--input-bg);
      color: #ffffff;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .weight-notice {
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* 命運 / 結果卡片 */
    .fate-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #1e293b;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .score-display {
      margin: 16px 0;
      text-align: center;
    }

    .score-display .sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-display .main-score {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.1;
      transition: color 0.3s;
    }

    .score-unit {
      font-size: 1.2rem;
      font-weight: 600;
      margin-left: 4px;
    }

    .fate-quote {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      min-height: 78px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--primary);
    }

    .progress-section {
      margin-top: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 10px;
      background: #334155;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 9999px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* 科目清單區塊 */
    .course-list-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e2e8f0;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .course-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .course-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .course-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      color: var(--state-critical);
      background: rgba(248, 113, 113, 0.15);
    }

    .course-stats {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: #1e293b;
      border: 2px dashed var(--card-border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>期末 Pass 算命機 🎯</h1>
      <p>期中考後算命・期末考後算總帳・掌握及格生存指南</p>
    </header>

    <!-- 模式切換按鈕 -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabModeTarget" type="button">
        🔮 功能一：期中後「逆算期末要考幾分」
      </button>
      <button class="tab-btn" id="tabModeFinal" type="button">
        📊 功能二：期末後「輸入期末算總成績」
      </button>
    </div>

    <!-- 學期生存數據總體檢 -->
    <div class="summary-bar">
      <div class="summary-item">
        <span class="label">已儲存科目</span>
        <span class="val" id="summaryTotal">0 科</span>
      </div>
      <div class="summary-item">
        <span class="label">高危險警戒科數</span>
        <span class="val" id="summaryDanger" style="color: var(--state-critical);">0 科</span>
      </div>
      <div class="summary-item">
        <span class="label" id="summaryAvgLabel">平均期末需求門檻</span>
        <span class="val" id="summaryAvg">-- 分</span>
      </div>
      <div>
        <button id="btnClearAll" style="background: #0f172a; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; color: #94a3b8; cursor: pointer;">清空全部科目</button>
      </div>
    </div>

    <div class="grid-main">
      <!-- 輸入表單卡片 -->
      <div class="card">
        <div class="card-title" id="formTitle">📝 期中考後：逆算期末及格門檻</div>
        
        <div class="form-group">
          <label>科目名稱</label>
          <input type="text" id="courseName" placeholder="例如：必修微積分、新聞學..." value="必修微積分">
        </div>

        <!-- 功能一欄位：目標總成績 -->
        <div class="form-group" id="groupTargetScore">
          <label>目標總成績 (分)</label>
          <input type="number" id="targetScore" value="60" min="0" max="100">
        </div>

        <!-- 平時配分 -->
        <div class="form-row">
          <div class="form-group">
            <label>平時成績 (分)</label>
            <input type="number" id="assignmentScore" value="82" min="0" max="100">
          </div>
          <div class="form-group">
            <label>平時佔比 (%)</label>
            <input type="number" id="assignmentWeight" value="30" min="0" max="100">
          </div>
        </div>

        <!-- 期中配分 -->
        <div class="form-row">
          <div class="form-group">
            <label>期中成績 (分)</label>
            <input type="number" id="midtermScore" value="48" min="0" max="100">
          </div>
          <div class="form-group">
            <label>期中佔比 (%)</label>
            <input type="number" id="midtermWeight" value="30" min="0" max="100">
          </div>
        </div>

        <!-- 功能二欄位：期末實考與期末佔比（預設隱藏） -->
        <div class="form-row" id="groupFinalExam" style="display: none;">
          <div class="form-group">
            <label>期末實際考了 (分)</label>
            <input type="number" id="actualFinalScore" value="70" min="0" max="100">
          </div>
          <div class="form-group">
            <label>期末考佔比 (%)</label>
            <input type="number" id="actualFinalWeight" value="40" min="0" max="100">
          </div>
        </div>

        <div class="form-group">
          <label>額外加分項（出席/加分作業，直接累加總分）</label>
          <input type="number" id="bonusScore" value="0" min="0" max="30">
        </div>

        <div class="weight-notice" id="weightNoticeBox">
          <span id="weightNoticeText">期末考佔比自動反推：</span>
          <strong id="finalWeightDisplay">40 %</strong>
        </div>

        <button class="btn btn-primary" id="btnSaveCourse">
          💾 儲存此科目到我的清單
        </button>
      </div>

      <!-- 即時運算結果與算命卡片 -->
      <div class="card fate-card">
        <div>
          <div class="card-title" id="fateTitle">🔮 算命機開示</div>
          <span class="status-badge" id="statusBadge">計算中...</span>
          
          <div class="score-display">
            <div class="sub" id="scoreSubLabel">期末考最低及格分數</div>
            <div class="main-score" id="finalScoreVal">--</div>
          </div>

          <div class="fate-quote" id="fateQuoteText">
            請輸入上方成績與佔比，立即查看命運指引。
          </div>
        </div>

        <div class="progress-section">
          <div class="progress-meta">
            <span id="progressMetaLabel">目前已握有分數（底氣）</span>
            <span id="currentPointsText">0.0 / 60 分</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部清單 -->
    <div>
      <div class="course-list-title">
        <span>📚 我的學期科目戰情室</span>
      </div>
      <div class="course-grid" id="courseGrid"></div>
    </div>
  </div>

  <script>
    let currentMode = 'target';

    const FATE_RULES_TARGET = [
      {
        threshold: 0,
        badge: "🟢 躺平保證",
        color: "var(--state-safe)",
        badgeBg: "rgba(52, 211, 153, 0.2)",
        badgeColor: "#6ee7b7",
        quote: "恭喜尊者！期中與平時底氣太厚，就算期末考卷拿去摺紙飛機，你這門課也穩過啦！"
      },
      {
        threshold: 60,
        badge: "🔵 安全上岸",
        color: "var(--state-info)",
        badgeBg: "rgba(56, 189, 248, 0.2)",
        badgeColor: "#7dd3fc",
        quote: "一片坦途！考前正常翻翻書、有睡飽、考試不睡過頭，Pass 只是舉手之勞。"
      },
      {
        threshold: 85,
        badge: "🟡 點燃肝指數",
        color: "var(--state-warn)",
        badgeBg: "rgba(251, 191, 36, 0.2)",
        badgeColor: "#fde68a",
        quote: "有點硬！接下來兩週請遠離手遊與聚餐，期中留下的坑需要期末全力以赴！"
      },
      {
        threshold: 100,
        badge: "🟠 向天借膽",
        color: "var(--state-danger)",
        badgeBg: "rgba(251, 146, 60, 0.2)",
        badgeColor: "#fed7aa",
        quote: "極高危險！期末必須超常發揮。建議現在就坐第一排、跟教授打招呼，或考慮去拜文昌帝君！"
      },
      {
        threshold: Infinity,
        badge: "🔴 醫學奇蹟",
        color: "var(--state-critical)",
        badgeBg: "rgba(248, 113, 113, 0.2)",
        badgeColor: "#fca5a5",
        quote: "期末需要突破天際才能過！就算教授是你親戚也難救，建議儘速確認學校停修/棄選截止日。"
      }
    ];

    const FATE_RULES_TOTAL = [
      {
        min: 90,
        badge: "🏆 學霸降臨",
        color: "var(--state-safe)",
        badgeBg: "rgba(52, 211, 153, 0.2)",
        badgeColor: "#6ee7b7",
        quote: "90+ 分封神！書卷獎在向你招手，請收下眾人的膝蓋。"
      },
      {
        min: 80,
        badge: "🌟 高分飛過",
        color: "var(--state-info)",
        badgeBg: "rgba(56, 189, 248, 0.2)",
        badgeColor: "#7dd3fc",
        quote: "表現相當優異！GPA 大幅進補，今晚可以安心點份大餐犒賞自己了。"
      },
      {
        min: 60,
        badge: "🎉 壓線及格",
        color: "var(--state-warn)",
        badgeBg: "rgba(251, 191, 36, 0.2)",
        badgeColor: "#fde68a",
        quote: "60分萬歲，多一分浪費！順利拿到學分，這學期的辛苦沒有白費！"
      },
      {
        min: 50,
        badge: "😭 殘念飲恨",
        color: "var(--state-danger)",
        badgeBg: "rgba(251, 146, 60, 0.2)",
        badgeColor: "#fed7aa",
        quote: "就差那麼一點點！趕緊帶著你這學期全勤的誠意去找教授聊聊，說不定還有生機！"
      },
      {
        min: 0,
        badge: "💀 明年再來",
        color: "var(--state-critical)",
        badgeBg: "rgba(248, 113, 113, 0.2)",
        badgeColor: "#fca5a5",
        quote: "學分確定落入虛空。沒關係，重修的路上你不是一個人，整理心情下學期再來！"
      }
    ];

    // DOM 元素選取
    const tabModeTarget = document.getElementById("tabModeTarget");
    const tabModeFinal = document.getElementById("tabModeFinal");
    const formTitle = document.getElementById("formTitle");
    const groupTargetScore = document.getElementById("groupTargetScore");
    const groupFinalExam = document.getElementById("groupFinalExam");
    const weightNoticeText = document.getElementById("weightNoticeText");
    const weightNoticeBox = document.getElementById("weightNoticeBox");
    const finalWeightDisplay = document.getElementById("finalWeightDisplay");

    const courseNameInput = document.getElementById("courseName");
    const targetScoreInput = document.getElementById("targetScore");
    const assignmentScoreInput = document.getElementById("assignmentScore");
    const assignmentWeightInput = document.getElementById("assignmentWeight");
    const midtermScoreInput = document.getElementById("midtermScore");
    const midtermWeightInput = document.getElementById("midtermWeight");
    const actualFinalScoreInput = document.getElementById("actualFinalScore");
    const actualFinalWeightInput = document.getElementById("actualFinalWeight");
    const bonusScoreInput = document.getElementById("bonusScore");

    const fateTitle = document.getElementById("fateTitle");
    const statusBadge = document.getElementById("statusBadge");
    const scoreSubLabel = document.getElementById("scoreSubLabel");
    const finalScoreVal = document.getElementById("finalScoreVal");
    const fateQuoteText = document.getElementById("fateQuoteText");
    const progressMetaLabel = document.getElementById("progressMetaLabel");
    const currentPointsText = document.getElementById("currentPointsText");
    const progressBar = document.getElementById("progressBar");

    const courseGrid = document.getElementById("courseGrid");
    const btnSaveCourse = document.getElementById("btnSaveCourse");
    const btnClearAll = document.getElementById("btnClearAll");

    const summaryTotal = document.getElementById("summaryTotal");
    const summaryDanger = document.getElementById("summaryDanger");
    const summaryAvg = document.getElementById("summaryAvg");
    const summaryAvgLabel = document.getElementById("summaryAvgLabel");

    let savedCourses = JSON.parse(localStorage.getItem("passmaster_courses") || "[]");

    // 切換模式函數
    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'target') {
        tabModeTarget.classList.add("active");
        tabModeFinal.classList.remove("active");
        formTitle.innerHTML = "📝 期中考後：逆算期末及格門檻";
        groupTargetScore.style.display = "block";
        groupFinalExam.style.display = "none";
        weightNoticeBox.style.display = "flex";
        weightNoticeText.innerText = "期末考佔比自動反推：";
        fateTitle.innerText = "🔮 算命機開示";
        scoreSubLabel.innerText = "期末考最低及格分數";
        progressMetaLabel.innerText = "目前已握有分數（底氣）";
        summaryAvgLabel.innerText = "平均期末需求門檻";
      } else {
        tabModeFinal.classList.add("active");
        tabModeTarget.classList.remove("active");
        formTitle.innerHTML = "📊 期末考後：輸入期末成績算學期總分";
        groupTargetScore.style.display = "none";
        groupFinalExam.style.display = "grid";
        weightNoticeBox.style.display = "flex";
        weightNoticeText.innerText = "目前三項佔比總和：";
        fateTitle.innerText = "🎓 學期成績結算";
        scoreSubLabel.innerText = "預估學期總成績";
        progressMetaLabel.innerText = "總成績進度 (滿分 100)";
        summaryAvgLabel.innerText = "清單平均總成績";
      }
      calculate();
    }

    // 計算邏輯
    function calculate() {
      const aScore = parseFloat(assignmentScoreInput.value) || 0;
      const aWeight = parseFloat(assignmentWeightInput.value) || 0;
      const mScore = parseFloat(midtermScoreInput.value) || 0;
      const mWeight = parseFloat(midtermWeightInput.value) || 0;
      const bonus = parseFloat(bonusScoreInput.value) || 0;

      if (currentMode === 'target') {
        const target = parseFloat(targetScoreInput.value) || 0;
        const finalWeight = 100 - (aWeight + mWeight);

        if (finalWeight <= 0) {
          finalWeightDisplay.innerText = "佔比超標 (平時+期中 >= 100%)";
          finalWeightDisplay.style.color = "var(--state-critical)";
          finalScoreVal.innerText = "ERR";
          statusBadge.innerText = "權重錯誤";
          statusBadge.style.background = "rgba(248, 113, 113, 0.2)";
          statusBadge.style.color = "#fca5a5";
          fateQuoteText.innerText = "請修正平時與期中佔比，兩者合計不能大於或等於 100% 喔！";
          return null;
        } else {
          finalWeightDisplay.innerText = `${finalWeight} %`;
          finalWeightDisplay.style.color = "#e2e8f0";
        }

        const currentPoints = (aScore * (aWeight / 100)) + (mScore * (mWeight / 100)) + bonus;
        const neededFinal = (target - currentPoints) / (finalWeight / 100);
        const roundedFinal = Math.round(neededFinal * 10) / 10;

        let selectedRule = FATE_RULES_TARGET[FATE_RULES_TARGET.length - 1];
        for (let rule of FATE_RULES_TARGET) {
          if (roundedFinal <= rule.threshold) {
            selectedRule = rule;
            break;
          }
        }

        statusBadge.innerText = selectedRule.badge;
        statusBadge.style.backgroundColor = selectedRule.badgeBg;
        statusBadge.style.color = selectedRule.badgeColor;

        if (roundedFinal <= 0) {
          finalScoreVal.innerHTML = `0<span class="score-unit">分 (隨便考)</span>`;
        } else {
          finalScoreVal.innerHTML = `${roundedFinal}<span class="score-unit">分</span>`;
        }
        finalScoreVal.style.color = selectedRule.color;
        fateQuoteText.innerText = selectedRule.quote;

        const progressPercent = Math.min(100, Math.max(0, (currentPoints / (target || 60)) * 100));
        progressBar.style.width = `${progressPercent}%`;
        progressBar.style.backgroundColor = selectedRule.color;
        currentPointsText.innerText = `${currentPoints.toFixed(1)} / ${target} 分 (${Math.round(progressPercent)}%)`;

        return {
          mode: 'target',
          name: courseNameInput.value.trim() || "未命名科目",
          target,
          neededFinal: roundedFinal,
          currentPoints: Math.round(currentPoints * 10) / 10,
          badge: selectedRule.badge,
          badgeBg: selectedRule.badgeBg,
          badgeColor: selectedRule.badgeColor,
          isDanger: roundedFinal > 85
        };

      } else {
        const fScore = parseFloat(actualFinalScoreInput.value) || 0;
        const fWeight = parseFloat(actualFinalWeightInput.value) || 0;
        const totalWeight = aWeight + mWeight + fWeight;

        finalWeightDisplay.innerText = `${totalWeight} % ${totalWeight !== 100 ? '(建議調整為 100%)' : '✓'}`;
        finalWeightDisplay.style.color = totalWeight === 100 ? "var(--state-safe)" : "var(--state-warn)";

        const rawTotal = (aScore * (aWeight / 100)) + (mScore * (mWeight / 100)) + (fScore * (fWeight / 100)) + bonus;
        const finalTotal = Math.round(rawTotal * 10) / 10;

        let selectedRule = FATE_RULES_TOTAL[FATE_RULES_TOTAL.length - 1];
        for (let rule of FATE_RULES_TOTAL) {
          if (finalTotal >= rule.min) {
            selectedRule = rule;
            break;
          }
        }

        statusBadge.innerText = selectedRule.badge;
        statusBadge.style.backgroundColor = selectedRule.badgeBg;
        statusBadge.style.color = selectedRule.badgeColor;

        finalScoreVal.innerHTML = `${finalTotal}<span class="score-unit">分</span>`;
        finalScoreVal.style.color = selectedRule.color;
        fateQuoteText.innerText = selectedRule.quote;

        const progressPercent = Math.min(100, Math.max(0, finalTotal));
        progressBar.style.width = `${progressPercent}%`;
        progressBar.style.backgroundColor = selectedRule.color;
        currentPointsText.innerText = `${finalTotal} / 100 分`;

        return {
          mode: 'final',
          name: courseNameInput.value.trim() || "未命名科目",
          finalTotal,
          fScore,
          badge: selectedRule.badge,
          badgeBg: selectedRule.badgeBg,
          badgeColor: selectedRule.badgeColor,
          isDanger: finalTotal < 60
        };
      }
    }

    function saveCourse() {
      const result = calculate();
      if (!result) return;

      const courseObj = {
        id: Date.now(),
        ...result
      };

      savedCourses.unshift(courseObj);
      localStorage.setItem("passmaster_courses", JSON.stringify(savedCourses));
      renderCourseList();
    }

    window.deleteCourse = function(id) {
      savedCourses = savedCourses.filter(c => c.id !== id);
      localStorage.setItem("passmaster_courses", JSON.stringify(savedCourses));
      renderCourseList();
    };

    function renderCourseList() {
      if (savedCourses.length === 0) {
        courseGrid.innerHTML = `
          <div class="empty-state">
            <p>目前還沒有儲存任何科目 📖</p>
            <p style="font-size: 0.85rem; margin-top: 6px;">在上方調整成績與佔比，點擊「儲存此科目」來建立你的專屬戰情室！</p>
          </div>
        `;
        summaryTotal.innerText = "0 科";
        summaryDanger.innerText = "0 科";
        summaryAvg.innerText = "-- 分";
        return;
      }

      let totalVal = 0;
      let dangerCount = 0;

      courseGrid.innerHTML = savedCourses.map(course => {
        if (course.isDanger) dangerCount++;
        
        if (course.mode === 'target') {
          totalVal += Math.max(0, course.neededFinal);
          return `
            <div class="course-card">
              <div>
                <div class="course-card-header">
                  <span class="course-name">${course.name}</span>
                  <button class="btn-delete" onclick="deleteCourse(${course.id})" title="刪除">✕</button>
                </div>
                <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
                  <span class="status-badge" style="background:${course.badgeBg}; color:${course.badgeColor}; font-size:0.75rem; margin-bottom:0;">
                    ${course.badge}
                  </span>
                  <span style="font-size:0.75rem; color:#94a3b8; background:#0f172a; padding:2px 8px; border-radius:9999px; border:1px solid #334155;">期中預測</span>
                </div>
                <div class="course-stats">
                  <div>🎯 目標分數：<strong>${course.target} 分</strong></div>
                  <div>🛡️ 目前已有底氣：<strong>${course.currentPoints} 分</strong></div>
                </div>
              </div>
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--card-border); display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 0.82rem; color: var(--text-muted);">期末至少需要：</span>
                <span style="font-size: 1.3rem; font-weight: 800; color: #a5b4fc;">
                  ${course.neededFinal <= 0 ? "0 (躺平)" : course.neededFinal + " 分"}
                </span>
              </div>
            </div>
          `;
        } else {
          totalVal += course.finalTotal;
          return `
            <div class="course-card">
              <div>
                <div class="course-card-header">
                  <span class="course-name">${course.name}</span>
                  <button class="btn-delete" onclick="deleteCourse(${course.id})" title="刪除">✕</button>
                </div>
                <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
                  <span class="status-badge" style="background:${course.badgeBg}; color:${course.badgeColor}; font-size:0.75rem; margin-bottom:0;">
                    ${course.badge}
                  </span>
                  <span style="font-size:0.75rem; color:#c7d2fe; background:#312e81; padding:2px 8px; border-radius:9999px; border:1px solid #4338ca;">期末結算</span>
                </div>
                <div class="course-stats">
                  <div>📝 期末實考：<strong>${course.fScore} 分</strong></div>
                  <div>📌 狀態：<strong>${course.finalTotal >= 60 ? "通過 (Pass)" : "未通過 (Fail)"}</strong></div>
                </div>
              </div>
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--card-border); display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 0.82rem; color: var(--text-muted);">學期總成績：</span>
                <span style="font-size: 1.3rem; font-weight: 800; color: ${course.finalTotal >= 60 ? 'var(--state-safe)' : 'var(--state-critical)'};">
                  ${course.finalTotal} 分
                </span>
              </div>
            </div>
          `;
        }
      }).join("");

      summaryTotal.innerText = `${savedCourses.length} 科`;
      summaryDanger.innerText = `${dangerCount} 科`;
      const avg = Math.round((totalVal / savedCourses.length) * 10) / 10;
      summaryAvg.innerText = `${avg} 分`;
    }

    // 事件監聽綁定
    tabModeTarget.addEventListener("click", () => switchMode('target'));
    tabModeFinal.addEventListener("click", () => switchMode('final'));

    const inputs = [
      courseNameInput, targetScoreInput, assignmentScoreInput,
      assignmentWeightInput, midtermScoreInput, midtermWeightInput,
      actualFinalScoreInput, actualFinalWeightInput, bonusScoreInput
    ];
    inputs.forEach(input => input.addEventListener("input", calculate));

    btnSaveCourse.addEventListener("click", saveCourse);
    btnClearAll.addEventListener("click", () => {
      if (savedCourses.length === 0) return;
      if (confirm("確定要清空所有已儲存的科目資料嗎？")) {
        savedCourses = [];
        localStorage.removeItem("passmaster_courses");
        renderCourseList();
      }
    });

    calculate();
    renderCourseList();
  </script>
</body>
</html>
